<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Product preview card component</title>

  <link rel="stylesheet" href="./styles/style.css">

</head>

<body>

  <main>

    <div class="container">
      <article class="product-card">

        <div class="product-img">
          <img src="./images/image-product-mobile.jpg" alt="product image">
        </div>

        <div class="product-details">
          <p class="product-type">Perfume</p>

          <h1 class="product-name">Gabrielle Essence Eau De Parfum</h1>

          <p class="product-about">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

          <div class="product-price">
            <p class="product-price-now">$149.99</p>
            <p class="product-price-before">$169.99</p>
          </div>

          <a class="add-to-cart-button" href="#"> Add to Cart</a>

        </div>
      </article>
    </div>
  </main>

</body>

</html>
