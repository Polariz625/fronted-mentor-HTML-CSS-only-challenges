<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | NFT preview card component</title>

  <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

  <main>
    <div class="container">
      <article class="nft-card">
        <div class="grid">

          <a class="nft-card-main-img" href="#">
            <img src="./images/image-equilibrium.jpg" alt="nft preview">
            <aside class="overlay">
              <img src="./images/icon-view.svg" alt="view icon">
            </aside>
          </a>

          <h1><a class="nft-name" href="#">Equilibrium #3429</a></h1>

          <p class="nft-description">Our Equilibrium collection promotes balance and calm.</p>

          <div class="nft-cost">
            <div class="nft-price">
              <img src="./images/icon-ethereum.svg" alt="ethereum icon">
              <p>0.041 ETH</p>
            </div>

            <div class="nft-price-countdown">
              <img src="./images/icon-clock.svg" alt="clock icon">
              <p>3 days left</p>
            </div>
          </div>

          <div class="nft-author">
            <img src="./images/image-avatar.png" alt="author avatar">
            <a href="#"><span>Creation of</span> Jules Wyvern</a>
          </div>
        </div>
      </article>
    </div>
  </main>

</body>

</html>
