<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Profile card component</title>

  <link rel="stylesheet" href="./styles/main.css">
</head>

<body>

  <main>
    <div class="container">
      <article class="card">

        <div class="card-top"></div>

        <div class="user-details">
          <img src="./assets/images/image-victor.jpg" alt="user picture">

          <div class="user-info">
            <div>
              <h1 class="user-name">Victor Crest <span>26</span></h1>
            </div>
            <p class="user-location">London</p>
          </div>


          <div class="user-stats">
            <div class="followers">
              <h2>80K</h2>
              <p>Followers</p>
            </div>

            <div class="likes">
              <h2>803K</h2>
              <p>Likes</p>
            </div>

            <div class="photos">
              <h2>1.4K</h2>
              <p>Photos</p>
            </div>
          </div>
        </div>
      </article>
    </div>

  </main>

</body>

</html>
