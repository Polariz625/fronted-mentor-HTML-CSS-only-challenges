<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>

  <link rel="stylesheet" href="./style/styles.css">
</head>

<body>

  <main class="profile-cards container">
    <article class="profile-card">
      <div class="user-personal-info">
        <img src="./assets/images/avatar-jessica.jpeg" alt="user profile picture" class="user-image">
        <h1 class="user-name">Jessica Randall</h1>
        <p class="user-location">London, United Kingdom</p>
        <p class="user-description">"Front-end developer and avid reader."</p>
      </div>
      <div class="socials">
        <a href="#">GitHub</a>
        <a href="#">Frontend Mentor</a>
        <a href="#">LinkedIn</a>
        <a href="#">Twitter</a>
        <a href="#">Instagram</a>
      </div>
    </article>
  </main>


</body>

</html>
