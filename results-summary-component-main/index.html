<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Results summary component</title>

  <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

  <main>

    <div class="container">
      <article class="rs-component">

        <section class="result-block">
          <h1>Your Result</h1>

          <div class="score">
            <div>
              <p class="final-score">76</p>
              <p class="total-score">of 100</p>
            </div>
          </div>

          <div class="final-score-message">
            <h2>Great</h2>
            <p>You scored higher than 65% of the people who have taken these tests.</p>
          </div>
        </section>

        <section class="summary-block">
          <h2>Summary</h2>

          <div class="summary-row">
            <div class="summary-row-skill">
              <img src="./assets/images/icon-reaction.svg" alt="reaction score icon">
              <p>Reaction</p>
            </div>
            <p class="summary-row-score"><b>80</b> <span>/ 100</span></p>
          </div>

          <div class="summary-row">
            <div class="summary-row-skill">
              <img src="./assets/images/icon-memory.svg" alt="memory score icon">
              <p>Memory</p>
            </div>
            <p class="summary-row-score"><b>92</b> <span>/ 100</span></p>
          </div>

          <div class="summary-row">
            <div class="summary-row-skill">
              <img src="./assets/images/icon-verbal.svg" alt="verbal score icon">
              <p>Verbal</p>
            </div>
            <p class="summary-row-score"><b>61</b> <span>/ 100</span></p>
          </div>

          <div class="summary-row">
            <div class="summary-row-skill">
              <img src="./assets/images/icon-visual.svg" alt="visual score icon">
              <p>Visual</p>
            </div>
            <p class="summary-row-score"><b>72</b> <span>/ 100</span></p>
          </div>

          <div class="summary-buttom">Continue</div>

        </section>
      </article>
    </div>
  </main>


</body>

</html>
